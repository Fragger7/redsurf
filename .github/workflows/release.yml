name: Semantic Release & APK

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release RedSurf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Semantic Version
        id: version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: "master,main"
          create_annotated_tag: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # The Gradle wrapper is committed and pinned to 8.7, so CI and local builds
      # run byte-identical Gradle. No gradle-version action needed.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Refusing to publish an unsigned or debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/redsurf-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/redsurf-release.jks" >> "$GITHUB_ENV"

      - name: Run Regression Suite
        working-directory: tv-native
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        working-directory: tv-native
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.new_tag }} \
            -PversionCode=${{ github.run_number }}

      # An unsigned or debug-signed APK must never reach a release: it would be
      # unable to update any installed copy, which is the exact bug this pipeline
      # shipped 40 times before.
      - name: Verify the APK is signed with the release key
        working-directory: tv-native
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is debug-signed. Refusing to publish."
            exit 1
          fi
          echo "Signing certificate:"
          grep -i "SHA-256 digest" /tmp/certs.txt

      - name: Rename APK
        run: |
          mv tv-native/app/build/outputs/apk/release/app-release.apk \
             tv-native/app/build/outputs/apk/release/RedSurf-${{ steps.version.outputs.new_tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: RedSurf ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
          files: tv-native/app/build/outputs/apk/release/RedSurf-${{ steps.version.outputs.new_tag }}.apk
