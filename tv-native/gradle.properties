android.useAndroidX=true
android.enableJetifier=true
# Connected tests (:benchmark, generateBaselineProfile) must never uninstall com.redsurf.tv after a
# run: on 2026-10-29 the test runner's cleanup did exactly that on the family TV and wiped its
# playlists, even though its own install had failed.
android.injected.androidTest.leaveApksInstalledAfterRun=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
